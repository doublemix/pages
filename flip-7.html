<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip-7 Scorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/@doublemx2/combine-objects@0.12.0/dist/umd/combine.js"></script>
  <script src="https://app.unpkg.com/tailwind-merge@3.3.1/files/dist/es5/bundle-cjs.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React

    const { clsx } = (function () {
      let module = {}
      module.exports = {}
      function r(e) { var o, t, f = ""; if ("string" == typeof e || "number" == typeof e) f += e; else if ("object" == typeof e) if (Array.isArray(e)) { var n = e.length; for (o = 0; o < n; o++)e[o] && (t = r(e[o])) && (f && (f += " "), f += t) } else for (t in e) e[t] && (f && (f += " "), f += t); return f } function e() { for (var e, o, t = 0, f = "", n = arguments.length; t < n; t++)(e = arguments[t]) && (o = r(e)) && (f && (f += " "), f += o); return f } module.exports = e, module.exports.clsx = e;
      return module.exports
    })()


    function cn(...classes) {
      return (clsx(...classes))
    }

    const t = {
      arrays: {
        push: item => it => [...it, item],
        filter: predicate => it => it.filter(predicate),
        updateEach: update => it => it.map(item => combine(item, update)),
      },
      updates: {
        if: (condition, update) => item => combine(item, condition) ? combine(item, update) : combine.ignore()
      }
    }

    function* range(start, end) {
      for (let i = start; i < end; i++) {
        yield i
      }
    }

    function map(fn) {
      return function* (iterable) {
        for (const item of iterable) {
          yield fn(item)
        }
      }
    }

    function pipe(iterable, ...fns) {
      return fns.reduce((acc, fn) => fn(acc), iterable)
    }

    function useStorage(initialState, key, storage = localStorage) {
      const [state, setState] = useState(() => {
        const storedState = storage.getItem(key);
        return storedState ? JSON.parse(storedState) : initialState;
      });

      useEffect(() => {
        storage.setItem(key, JSON.stringify(state));
      }, [state]);

      return [state, setState];
    }

    function useReducerState(initialState) {
      const [state, setState] = useStorage(initialState, 'flip-7-state', sessionStorage)

      const dispatch = (update) => {
        setState(oldState => combine(oldState, update))
      }

      return [state, dispatch]
    }

    const DispatchContext = React.createContext(null);
    const useDispatch = () => React.useContext(DispatchContext);

    function generateId() {
      return '_' + Math.random().toString(36).substr(2, 9);
    }

    const addNewPlayer = ({ name }) => ({
      players: t.arrays.push({ id: generateId(), name, score: 0, selectedCards: [], isBusted: false }),
      newPlayerName: '',
    })

    function Card({ className, children }) {
      return <div className={`bg-white p-8 rounded-lg shadow-md ${className || ''}`}>{children}</div>
    }

    function Button({ children, className, ...otherButtonProps }) {
      return (
        <button
          {...otherButtonProps}
          className={`bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded disabled:bg-gray-400 disabled:cursor-not-allowed active:bg-blue-700 ${className || ''}`}
        >
          {children}
        </button>
      )
    }

    const cards = [
      ...(pipe(range(0, 12 + 1), map(n => ({ type: 'number', number: n, id: `number-${n}` })))),
      { type: 'multiplier', value: 2, id: 'multiplier-2' },
      { type: 'bonus', value: 2, id: 'bonus-2' },
      { type: 'bonus', value: 4, id: 'bonus-4' },
      { type: 'bonus', value: 6, id: 'bonus-6' },
      { type: 'bonus', value: 8, id: 'bonus-8' },
      { type: 'bonus', value: 10, id: 'bonus-10' },
    ]

    function updatePlayer(playerId, update) {
      return {
        players: t.arrays.updateEach(t.updates.if(player => player.id === playerId, update))
      }
    }

    function bustPlayer(playerId) {
      return updatePlayer(playerId, {
        isBusted: it => !it,
      })
    }

    function playerToggleCard(playerId, cardId) {
      return updatePlayer(playerId, {
        selectedCards: cards => cards.includes(cardId) ? cards.filter(id => id !== cardId) : [...cards, cardId]
      })
    }

    function removePlayer(playerId) {
      return {
        players: t.arrays.filter(player => player.id !== playerId)
      }
    }

    function setPlayerScore(playerId, nextScore) {
      return updatePlayer(playerId, {
        score: nextScore,
      })
    }

    function GameCard({ id, playerId, type, number, value, children, isSelected }) {
      const dispatch = useDispatch();
      const classNames = cn(
        'bg-white flex items-center justify-center rounded-lg shadow-md w-[60px] h-[40px] md:w-[60px] md:h-[80px] border border-gray-300 text-2xl font-bold',
        type === 'number' && 'text-blue-500',
        type === 'multiplier' && 'text-green-500 bg-yellow-200',
        type === 'bonus' && 'text-red-500 bg-yellow-200',
        !isSelected && 'brightness-[80%]'
      )
      return (
        <div className={classNames} onClick={() => dispatch(playerToggleCard(playerId, id))}>
          {type === 'number' && <span>{number}</span>}
          {type === 'multiplier' && <span>×{value}</span>}
          {type === 'bonus' && <span>+{value}</span>}
          {children}
        </div>
      )
    }

    function CardArray({ playerId, selectedCards }) {

      return <div className="flex flex-row flex-wrap md:flex-col gap-2 md:gap-4">
        <div className="contents md:flex flex-row flex-wrap gap-2 md:gap-4">
          {cards.filter(c => c.type === 'number').map((card, index) => (
            <GameCard key={card.id} {...card} playerId={playerId} isSelected={selectedCards.includes(card.id)} />
          ))}
        </div>
        <div className="contents md:flex flex-row flex-wrap gap-2 md:gap-4">
          {cards.filter(c => c.type === 'multiplier' || c.type === 'bonus').map((card, index) => (
            <GameCard key={card.id} {...card} playerId={playerId} isSelected={selectedCards.includes(card.id)} />
          ))}
        </div>
      </div>
    }

    function PlayerCard({ id, name, score, selectedCards, isBusted }) {
      const dispatch = useDispatch();
      const subTotal = calculateCardScore(selectedCards)
      const [manualScore, setManualScore] = useState(String(score))
      const [isEditingScore, setIsEditingScore] = useState(false)

      useEffect(() => {
        setManualScore(String(score))
      }, [score])

      const saveManualScore = () => {
        const parsedScore = Number(manualScore)
        if (!Number.isFinite(parsedScore)) {
          setManualScore(String(score))
          setIsEditingScore(false)
          return
        }

        dispatch(setPlayerScore(id, parsedScore))
        setIsEditingScore(false)
      }

      const cancelManualScore = () => {
        setManualScore(String(score))
        setIsEditingScore(false)
      }

      return (
        <div className={cn("bg-white p-4 md:p-8 md:rounded-lg shadow-md flex flex-col gap-2 md:gap-4", isBusted && "opacity-50")}>
          <div className="flex flex-row gap-x-8 gap-y-2 flex-wrap items-baseline">
            <h2 className="text-lg md:text-2xl font-bold">{name}</h2>
            {!isEditingScore ? (
              <button
                type="button"
                className="text-sm text-gray-500 hover:text-gray-700 underline decoration-dotted underline-offset-2"
                onClick={() => setIsEditingScore(true)}
              >
                Score: {score}
              </button>
            ) : (
              <label className="text-sm text-gray-500 flex items-center gap-2">
                <span>Score:</span>
                <input
                  type="number"
                  className="border border-gray-300 rounded py-1 px-2 w-24 text-gray-700"
                  value={manualScore}
                  autoFocus
                  onChange={e => setManualScore(e.target.value)}
                  onBlur={saveManualScore}
                  onKeyDown={e => {
                    if (e.key === 'Enter') {
                      e.preventDefault()
                      saveManualScore()
                    }
                    if (e.key === 'Escape') {
                      e.preventDefault()
                      cancelManualScore()
                    }
                  }}
                />
              </label>
            )}
            <p className="text-sm text-gray-500">Subtotal: {subTotal}</p>
            <div className="ms-auto self-center">
              <button onClick={() => dispatch(removePlayer(id))}>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  className="h-6 w-6"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  strokeWidth={2}
                >
                  <path
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    d="M6 18L18 6M6 6l12 12"
                  />
                </svg>
              </button>
            </div>
          </div>
          <CardArray playerId={id} selectedCards={selectedCards} />
          <Button onClick={() => dispatch(bustPlayer(id))}>
            {isBusted ? 'Busted' : 'Bust'}
          </Button>
        </div>
      )
    }

    function calculateCardScore(selectedCardIds) {
      const selectedCards = selectedCardIds.map(cardId => cards.find(c => c.id === cardId))
      const numberCards = selectedCards.filter(card => card && card.type === 'number')
      const multiplierCards = selectedCards.filter(card => card && card.type === 'multiplier')
      const bonusCards = selectedCards.filter(card => card && card.type === 'bonus')
      const numberCardSubtotal = numberCards.reduce((sum, card) => sum + card.number, 0)
      const multiplierTotal = multiplierCards.reduce((product, card) => product * card.value, 1)
      const bonusTotal = bonusCards.reduce((sum, card) => sum + card.value, 0)
      const flip7Bonus = selectedCards.length >= 7 ? 15 : 0
      return (numberCardSubtotal * multiplierTotal) + bonusTotal + flip7Bonus
    }

    function scoreRound() {
      return {
        players: t.arrays.updateEach(t.updates.if(player => player.selectedCards.length > 0, player => ({
          score: t.updates.if(!player.isBusted, score => score + calculateCardScore(player.selectedCards)),
          selectedCards: [],
          isBusted: false,
        }))),
      }
    }

    function reset() {
      return {
        players: t.arrays.updateEach(() => ({
          score: 0,
          selectedCards: [],
          isBusted: false,
        })),
      }
    }


    function App() {
      const [state, dispatch] = useReducerState({ newPlayerName: '', players: [] })

      const { players, newPlayerName } = state

      return (
        <DispatchContext.Provider value={dispatch}>
          <div className="py-4 flex flex-col gap-4 min-h-screen bg-gray-100 md:p-8 md:gap-8">
            {players.map((player, index) => (
              <PlayerCard key={index} {...player} />
            ))}
            <div className="px-4 md:px-0 flex flex-row flex-wrap gap-4">
              <Button
                onClick={() => dispatch(scoreRound())}
              >
                Score Round
              </Button>
              <Button
                onClick={() => dispatch(reset())}
              >
                Reset Game
              </Button>
            </div>

            <form className="px-4 flex flex-col gap-4 md:flex-row md:px-0">
              <input
                type="text"
                placeholder="Player Name"
                className="border border-gray-300 rounded py-2 px-4"
                value={state.newPlayerName || ''}
                onChange={e => dispatch({ newPlayerName: e.target.value })}
              />
              <Button
                disabled={!state.newPlayerName.trim()}
                onClick={() => dispatch(addNewPlayer({ name: newPlayerName.trim() }))}
              >
                Add Player
              </Button>
            </form>
          </div>
        </DispatchContext.Provider>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>

</html>
