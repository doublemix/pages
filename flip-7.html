<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip-7 Scorer</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/@doublemx2/combine-objects@0.12.0/dist/umd/combine.js"></script>
  <script src="https://app.unpkg.com/tailwind-merge@3.3.1/files/dist/es5/bundle-cjs.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React

    function iife(fn, ...args) {
      return fn(...args);
    }

    const { clsx } = (function () {
      let module = {}
      module.exports = {}
      function r(e) { var o, t, f = ""; if ("string" == typeof e || "number" == typeof e) f += e; else if ("object" == typeof e) if (Array.isArray(e)) { var n = e.length; for (o = 0; o < n; o++)e[o] && (t = r(e[o])) && (f && (f += " "), f += t) } else for (t in e) e[t] && (f && (f += " "), f += t); return f } function e() { for (var e, o, t = 0, f = "", n = arguments.length; t < n; t++)(e = arguments[t]) && (o = r(e)) && (f && (f += " "), f += o); return f } module.exports = e, module.exports.clsx = e;
      return module.exports
    })()


    function cn(...classes) {
      return (clsx(...classes))
    }

    const t = {
      arrays: {
        push: item => it => [...it, item],
        filter: predicate => it => it.filter(predicate),
        updateEach: update => it => it.map(item => combine(item, update)),
      },
      updates: {
        if: (condition, update) => item => combine(item, condition) ? combine(item, update) : combine.ignore()
      }
    }

    function* range(start, end) {
      for (let i = start; i < end; i++) {
        yield i
      }
    }

    function map(fn) {
      return function* (iterable) {
        for (const item of iterable) {
          yield fn(item)
        }
      }
    }

    function pipe(iterable, ...fns) {
      return fns.reduce((acc, fn) => fn(acc), iterable)
    }

    function useStorage(initialState, key, storage = localStorage) {
      const [state, setState] = useState(() => {
        const storedState = storage.getItem(key);
        return storedState ? JSON.parse(storedState) : initialState;
      });

      useEffect(() => {
        storage.setItem(key, JSON.stringify(state));
      }, [state]);

      return [state, setState];
    }

    function useReducerState(initialState, key) {
      const [state, setState] = useStorage(initialState, key, sessionStorage)

      const dispatch = (update) => {
        setState(oldState => combine(oldState, update))
      }

      return [state, dispatch]
    }

    const DispatchContext = React.createContext(null);
    const useDispatch = () => React.useContext(DispatchContext);

    function generateId() {
      return '_' + Math.random().toString(36).substr(2, 9);
    }

    const addNewPlayer = ({ name }) => ({
      players: t.arrays.push({ id: generateId(), name, score: 0, selectedCards: [], isBusted: false }),
      newPlayerName: '',
    })

    function Card({ className, children }) {
      return <div className={`bg-white p-8 rounded-lg shadow-md ${className || ''}`}>{children}</div>
    }

    function Button({ children, className, ...otherButtonProps }) {
      return (
        <button
          {...otherButtonProps}
          className={`bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded disabled:bg-gray-400 disabled:cursor-not-allowed active:bg-blue-700 ${className || ''}`}
        >
          {children}
        </button>
      )
    }

    const cards = [
      ...(pipe(range(0, 12 + 1), map(n => ({ type: 'number', number: n, id: `number-${n}` })))),
      { type: 'multiplier', value: 2, id: 'multiplier-2' },
      { type: 'bonus', value: 2, id: 'bonus-2' },
      { type: 'bonus', value: 4, id: 'bonus-4' },
      { type: 'bonus', value: 6, id: 'bonus-6' },
      { type: 'bonus', value: 8, id: 'bonus-8' },
      { type: 'bonus', value: 10, id: 'bonus-10' },
    ]

    function updatePlayer(playerId, update) {
      return {
        players: t.arrays.updateEach(t.updates.if(player => player.id === playerId, update))
      }
    }

    function bustPlayer(playerId) {
      return updatePlayer(playerId, {
        isBusted: it => !it,
      })
    }

    function playerToggleCard(playerId, cardId) {
      return updatePlayer(playerId, {
        selectedCards: cards => cards.includes(cardId) ? cards.filter(id => id !== cardId) : [...cards, cardId]
      })
    }

    function removePlayer(playerId) {
      return {
        players: t.arrays.filter(player => player.id !== playerId),
      }
    }

    function setPlayerScore(playerId, nextScore) {
      return updatePlayer(playerId, {
        score: nextScore,
      })
    }

    function GameCard({ id, playerId, type, number, value, children, isSelected }) {
      const dispatch = useDispatch();
      const classNames = cn(
        'bg-white flex items-center justify-center rounded-lg shadow-md w-[60px] h-[40px] md:w-[60px] md:h-[80px] border border-gray-300 text-2xl font-bold',
        type === 'number' && 'text-blue-500',
        type === 'multiplier' && 'text-green-500 bg-yellow-200',
        type === 'bonus' && 'text-red-500 bg-yellow-200',
        !isSelected && 'brightness-[80%]'
      )
      return (
        <div className={classNames} onClick={() => dispatch(playerToggleCard(playerId, id))}>
          {type === 'number' && <span>{number}</span>}
          {type === 'multiplier' && <span>×{value}</span>}
          {type === 'bonus' && <span>+{value}</span>}
          {children}
        </div>
      )
    }

    function CardArray({ playerId, selectedCards }) {

      return <div className="flex flex-row flex-wrap md:flex-col gap-2 md:gap-4">
        <div className="contents md:flex flex-row flex-wrap gap-2 md:gap-4">
          {cards.filter(c => c.type === 'number').map((card, index) => (
            <GameCard key={card.id} {...card} playerId={playerId} isSelected={selectedCards.includes(card.id)} />
          ))}
        </div>
        <div className="contents md:flex flex-row flex-wrap gap-2 md:gap-4">
          {cards.filter(c => c.type === 'multiplier' || c.type === 'bonus').map((card, index) => (
            <GameCard key={card.id} {...card} playerId={playerId} isSelected={selectedCards.includes(card.id)} />
          ))}
        </div>
      </div>
    }

    function X() {
      return <svg
        xmlns="http://www.w3.org/2000/svg"
        className="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        strokeWidth={2}
      >
        <path
          strokeLinecap="round"
          strokeLinejoin="round"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    }

    const initialDeck = iife(() => {
      const deck = []
      for (let i = 0; i <= 12; i++) {
        let count = i === 0 ? 1 : i;
        for (let j = 0; j < count; j++) {
          deck.push({ id: `${i}-${j}`, type: 'number', number: i })
        }
      }
      let actions = [{ type: 'freeze', children: 'FR', color: 'blue' }, { type: 'flip-3', children: '3', color: 'yellow' }, { type: 'second-chance', children: '<3', color: 'red' }]
      for (let action of actions) {
        for (let n = 0; n < 3; n++) {
          deck.push({ id: `${action.type}-${n}`, ...action })
        }
      }
      deck.push({ id: 'x2', type: 'bonus', value: 'x2' })
      deck.push({ id: '+2', type: 'bonus', value: '+2' })
      deck.push({ id: '+4', type: 'bonus', value: '+4' })
      deck.push({ id: '+6', type: 'bonus', value: '+6' })
      deck.push({ id: '+8', type: 'bonus', value: '+8' })
      deck.push({ id: '+10', type: 'bonus', value: '+10' })

      return deck;
    })

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function DeckEmpty(props) {
      return (
        <div className="rounded-md bg-gray-200 w-16 h-24" {...props}></div>
      )
    }

    const iconClassByScale = {
      'sm': 'w-4 h-4',
      'md': 'w-6 h-6',
    }

    function FreezeIcon({ scale = 'md' }) {
      return <svg className={iconClassByScale[scale]} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        {/* snowflake icon */}
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12.0000,12.0000 L18.0000,12.0000 M18.0000,12.0000 L20.0000,8.5359 M18.0000,12.0000 L22.0000,12.0000 M18.0000,12.0000 L20.0000,15.4641 M12.0000,12.0000 L15.0000,17.1962 M15.0000,17.1962 L19.0000,17.1962 M15.0000,17.1962 L17.0000,20.6603 M15.0000,17.1962 L13.0000,20.6603 M12.0000,12.0000 L9.0000,17.1962 M9.0000,17.1962 L11.0000,20.6603 M9.0000,17.1962 L7.0000,20.6603 M9.0000,17.1962 L5.0000,17.1962 M12.0000,12.0000 L6.0000,12.0000 M6.0000,12.0000 L4.0000,15.4641 M6.0000,12.0000 L2.0000,12.0000 M6.0000,12.0000 L4.0000,8.5359 M12.0000,12.0000 L9.0000,6.8038 M9.0000,6.8038 L5.0000,6.8038 M9.0000,6.8038 L7.0000,3.3397 M9.0000,6.8038 L11.0000,3.3397 M12.0000,12.0000 L15.0000,6.8038 M15.0000,6.8038 L13.0000,3.3397 M15.0000,6.8038 L17.0000,3.3397 M15.0000,6.8038 L19.0000,6.8038"></path>
      </svg>
    }

    function LightningIcon({ scale = 'md' }) {
      return <svg className={iconClassByScale[scale]} fill="currentColor" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
      </svg>
    }

    function HeartIcon({ scale = 'md' }) {
      return <svg className={iconClassByScale[scale]} fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
      </svg>
    }

    function DeckCard({ card, className, faceDown = false }) {
      return (
        <div className={cn(`pointer-events-none rounded-md w-16 h-24 transition-all duration-300 ${className} `)}>
          {faceDown && <div className="rounded-md bg-orange-900 text-white w-16 h-24 flex items-center justify-center text-lg">Flip-7</div>}
          {!faceDown && card && <>
            {card.type === 'number' && <div className="rounded-md bg-white text-black w-16 h-24 flex items-center justify-center border-4 border-black">
              <span className="text-2xl">{card.number}</span>
              <div className="absolute top-2 right-2 leading-none">{card.number}</div>
            </div>}
            {card.type === 'freeze' && <div className="rounded-md bg-blue-300 text-black w-16 h-24 flex items-center justify-center border-4 border-black">
              <FreezeIcon />
              <div className="absolute top-2 right-2 leading-none"><FreezeIcon scale="sm" /></div>
            </div>}
            {card.type === 'flip-3' && <div className="rounded-md bg-yellow-300 text-yellow-600 w-16 h-24 flex items-center justify-center border-4 border-black">
              <LightningIcon />
              <div className="absolute top-2 right-2 leading-none"><LightningIcon scale="sm" /></div>
            </div>}
            {card.type === 'second-chance' && <div className="rounded-md bg-pink-300 text-pink-600 w-16 h-24 flex items-center justify-center border-4 border-black">
              <HeartIcon />
              <div className="absolute top-2 right-2 leading-none"><HeartIcon scale="sm" /></div>
            </div>}
            {card.type === 'bonus' && <div className="rounded-md bg-orange-400 text-black w-16 h-24 flex items-center justify-center border-4 border-black">
              <span className="text-2xl">{card.value}</span>
              <div className="absolute top-2 right-2 leading-none">{card.value}</div>
            </div>}
          </>}
        </div>
      )
    }

    function DeckSimulator() {
      const [state, dispatch] = useReducerState({ deck: initialDeck, drawn: [], shuffled: false })

      const shuffleDeck = () => {
        let shuffledDeck = shuffle(state.deck)
        dispatch({ deck: shuffledDeck, shuffled: true })
      }

      useEffect(() => {
        if (!state.shuffled) shuffleDeck()
      }, [state])

      const drawCard = () => {
        dispatch(state => {
          if (state.deck.length === 0) return combine.ignore()
          const drawnCard = state.deck[0]
          const remainingDeck = state.deck.slice(1)
          return { deck: remainingDeck, drawn: [drawnCard, ...state.drawn] }
        })
      }

      const resetDeck = () => {
        dispatch({ deck: initialDeck, drawn: [], shuffled: false })
      }

      const topOfDeck = state.deck[0] ?? null
      const [topOfDraw1 = null, topOfDraw2 = null, topOfDraw3 = null, topOfDraw4 = null] = state.drawn

      const toRender = [
        { card: topOfDeck, position: 'absolute z-4 top-0 left-0', faceDown: true, },
        { card: topOfDraw1, position: 'absolute z-3 top-0 left-20' },
        { card: topOfDraw2, position: 'absolute z-2 top-0 left-26' },
        { card: topOfDraw3, position: 'absolute z-1 top-0 left-32' },
        { card: topOfDraw4, position: 'absolute z-0 top-0 left-32' },
      ]

      const requestDraw = () => {
        if (state.deck.length === 0) resetDeck()
        else drawCard()
      }

      return (
        <div className="flex flex-row flex-wrap gap-x-8 gap-y-4">
          <div className="relative w-48">
            <DeckEmpty onClick={requestDraw} />
            {toRender.map(({ card, position, faceDown = false }) => (
              card && <DeckCard key={card.id ?? 'empty'} card={card} className={position} faceDown={faceDown} />
            ))}
          </div>
          <div>
            <div>
              <Button onClick={resetDeck}>Reset Deck</Button>
            </div>
            <div>
              Cards: {state.deck.length}
            </div>
          </div>
        </div>
      )
    }

    function PlayerCard({ id, name, score, selectedCards, isBusted }) {
      const dispatch = useDispatch();
      const subTotal = calculateCardScore(selectedCards)
      const [manualScore, setManualScore] = useState(String(score))
      const [isEditingScore, setIsEditingScore] = useState(false)

      useEffect(() => {
        setManualScore(String(score))
      }, [score])

      const saveManualScore = () => {
        const parsedScore = Number(manualScore)
        if (!Number.isFinite(parsedScore)) {
          setManualScore(String(score))
          setIsEditingScore(false)
          return
        }

        dispatch(setPlayerScore(id, parsedScore))
        setIsEditingScore(false)
      }

      const cancelManualScore = () => {
        setManualScore(String(score))
        setIsEditingScore(false)
      }

      return (
        <div className={cn("bg-white p-4 md:p-8 md:rounded-lg shadow-md flex flex-col gap-2 md:gap-4", isBusted && "opacity-50")}>
          <div className="flex flex-row gap-x-8 gap-y-2 flex-wrap items-baseline">
            <h2 className="text-lg md:text-2xl font-bold">{name}</h2>
            {!isEditingScore ? (
              <button
                type="button"
                className="text-sm text-gray-500 hover:text-gray-700 underline decoration-dotted underline-offset-2"
                onClick={() => setIsEditingScore(true)}
              >
                Score: {score}
              </button>
            ) : (
              <label className="text-sm text-gray-500 flex items-center gap-2">
                <span>Score:</span>
                <input
                  type="number"
                  className="border border-gray-300 rounded py-1 px-2 w-24 text-gray-700"
                  value={manualScore}
                  autoFocus
                  onChange={e => setManualScore(e.target.value)}
                  onBlur={saveManualScore}
                  onKeyDown={e => {
                    if (e.key === 'Enter') {
                      e.preventDefault()
                      saveManualScore()
                    }
                    if (e.key === 'Escape') {
                      e.preventDefault()
                      cancelManualScore()
                    }
                  }}
                />
              </label>
            )}
            <p className="text-sm text-gray-500">Subtotal: {subTotal.score}</p>
            <div className="ms-auto self-center">
              <button onClick={() => dispatch(removePlayer(id))}>
                <X />
              </button>
            </div>
          </div>
          <CardArray playerId={id} selectedCards={selectedCards} />
          <Button onClick={() => dispatch(bustPlayer(id))}>
            {isBusted ? 'Busted' : 'Bust'}
          </Button>
        </div>
      )
    }

    function calculateCardScore(selectedCardIds) {
      const selectedCards = selectedCardIds.map(cardId => cards.find(c => c.id === cardId))
      const numberCards = selectedCards.filter(card => card && card.type === 'number')
      const multiplierCards = selectedCards.filter(card => card && card.type === 'multiplier')
      const bonusCards = selectedCards.filter(card => card && card.type === 'bonus')
      const numberCardSubtotal = numberCards.reduce((sum, card) => sum + card.number, 0)
      const multiplierTotal = multiplierCards.reduce((product, card) => product * card.value, 1)
      const bonusTotal = bonusCards.reduce((sum, card) => sum + card.value, 0)
      const isFlip7 = selectedCards.length >= 7
      const flip7Bonus = isFlip7 ? 15 : 0
      return { score: (numberCardSubtotal * multiplierTotal) + bonusTotal + flip7Bonus, isFlip7 }
    }

    function scoreRound() {
      return state => {
        const scoresByPlayer = Object.fromEntries(state.players.map(player => {
          const { score, isFlip7 } = calculateCardScore(player.selectedCards)
          return [player.id, { score, isFlip7, busted: player.isBusted }]
        }))

        return {
          roundScores: t.arrays.push(scoresByPlayer),
          players: t.arrays.updateEach(
            player => ({
              score: t.updates.if(!player.isBusted, score => score + scoresByPlayer[player.id].score),
              selectedCards: [],
              isBusted: false,
            }),
          ),
        }
      }
    }

    function reset() {
      return {
        players: t.arrays.updateEach(() => ({
          score: 0,
          selectedCards: [],
          isBusted: false,
        })),
        roundScores: [],
      }
    }

    function Dialog({ title, children, open, onClose }) {
      const dialogRef = useRef(null)

      useEffect(() => {
        if (open) {
          dialogRef.current.showModal()
        } else {
          dialogRef.current.close()
        }
      }, [open])

      useEffect(() => {
        const dialog = dialogRef.current;
        const handler = (e) => {
          e.preventDefault();
          onClose();
        };
        dialog.addEventListener("close", handler);
        dialog.addEventListener("cancel", handler);
        return () => {
          dialog.removeEventListener("close", handler);
          dialog.removeEventListener("cancel", handler);
        };
      }, [onClose]);

      return (
        <dialog ref={dialogRef} className="backdrop:bg-black/50">
          <div className="fixed inset-0 bg-white md:inset-12 md:rounded-lg">
            <div className="p-4 flex flex-row">
              <h2 className="text-xl font-bold">{title}</h2>
              <button onClick={onClose} className="ml-auto px-4">
                <X />
              </button>
            </div>
            {children}
          </div>
        </dialog>
      )
    }

    function ScoreSheet({ state }) {
      const { players, roundScores } = state

      return (
        <table className="min-w-full border-collapse border border-gray-200 [&_th]:border-x [&_th]:border-gray-200 [&_td]:border-x [&_td]:border-gray-200 table-fixed">
          <thead className="bg-gray-200 font-bold text-left">
            <tr>
              <th className="p-2">Round</th>
              {players.map(player => (
                <th key={player.id} className="p-2">{player.name}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {roundScores.map((round, roundIndex) => (
              <tr key={roundIndex}>
                <td className="p-2">{roundIndex + 1}</td>
                {players.map(player => {
                  const playerRound = round[player.id]
                  if (!playerRound) return null
                  const { score, busted, isFlip7 } = playerRound
                  return (
                    <td key={player.id} className='p-2'>
                      <div className="flex flex-row gap-2 items-center">
                        <span className={busted ? 'line-through text-gray-400' : ''}>{score}</span>
                        {isFlip7 && <span className="bg-blue-700 text-white text-sm/tight px-2 rounded-lg">Flip 7!</span>}
                      </div>
                    </td>
                  )
                })}
              </tr>
            ))}
          </tbody>
          <tfoot>
            <tr className="[&_td]:border-t-2 font-bold bg-gray-200">
              <td className="p-2">Total</td>
              {players.map(player => {
                return <td key={player.id} className="p-2">{player.score}</td>
              })}
            </tr>
          </tfoot>
        </table>
      )
    }

    function Drawer({ open, onClose, children }) {
      const [isMounted, setIsMounted] = useState(false)
      useEffect(() => {
        setIsMounted(true)
      }, [])

      return (
        <div style={{ display: isMounted ? undefined : 'none' }} className={cn('z-100 fixed bottom-0 left-0 right-0 transition-all duration-300', open ? 'translate-y-0 shadow-[0_-8px_12px_-6px_rgba(0,0,0,0.3)]' : 'translate-y-full shadow-none')}>
          <div className="bg-white p-4">
            {children}
          </div>
          <div className="absolute top-2 right-2">
            <button onClick={onClose} className="px-4 py-4"><X /></button>
          </div>
        </div>
      )
    }


    function App() {
      const [state, dispatch] = useReducerState({ players: [], roundScores: [] }, 'flip-7-state')

      const [newPlayerName, setNewPlayerName] = useState('')
      const [scoreSheetDialogOpen, setScoreSheetDialogOpen] = useState(false)

      const { players } = state

      const [isDeckSimulatorVisible, setIsDeckSimulatorVisible] = useState(false)

      const toggleDisplayDeckSimulator = () => setIsDeckSimulatorVisible(it => !it)

      return (
        <DispatchContext.Provider value={dispatch}>
          <div className="py-4 flex flex-col gap-4 min-h-screen bg-gray-100 md:p-8 md:gap-8">
            <Drawer open={isDeckSimulatorVisible} onClose={() => toggleDisplayDeckSimulator()}>
              <DeckSimulator />
            </Drawer>
            {players.map((player, index) => (
              <PlayerCard key={index} {...player} />
            ))}
            <div className="px-4 md:px-0 flex flex-row flex-wrap gap-4">
              <Button
                onClick={() => dispatch(scoreRound())}
              >
                Score Round
              </Button>
              <Button
                onClick={() => dispatch(reset())}
              >
                Reset Game
              </Button>
              <Button
                onClick={() => setScoreSheetDialogOpen(true)}
              >
                View Scoresheet
              </Button>
              <Dialog title="Scores" open={scoreSheetDialogOpen} onClose={() => setScoreSheetDialogOpen(false)}>
                <ScoreSheet state={state} />
              </Dialog>
              <Button
                onClick={() => toggleDisplayDeckSimulator()}
              >
                {isDeckSimulatorVisible ? 'Hide' : 'Show'} Deck
              </Button>
            </div>

            <form className="px-4 flex flex-col gap-4 md:flex-row md:px-0" onSubmit={e => { e.preventDefault(); dispatch(addNewPlayer({ name: newPlayerName.trim() })); setNewPlayerName(''); }}>
              <input
                type="text"
                placeholder="Player Name"
                className="border border-gray-300 rounded py-2 px-4 bg-white"
                value={newPlayerName}
                onChange={e => setNewPlayerName(e.target.value)}
              />
              <Button
                disabled={!newPlayerName.trim()}
              >
                Add Player
              </Button>
            </form>
          </div>
        </DispatchContext.Provider>
      );
    }

    const app = ReactDOM.createRoot(root)
    app.render(<App />);
  </script>
</body>

</html>
