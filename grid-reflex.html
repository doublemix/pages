<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Grid Reflex // 9-Square</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/vue@3"></script>

  <style>
    body {
      margin: 0;
      background: #0d1117;
      color: #f0f6fc;
      overscroll-behavior-y: contain;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      min-height: 100vh;
      height: 100%;
    }
    .container {
      max-width: 540px;
      margin-left: auto;
      margin-right: auto;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .full-column {
      display: flex;
      flex-flow: column nowrap;
      justify-content: center;
      flex-grow: 1;
    }
    
    .score-board {
      background: rgba(22, 27, 34, 0.8);
      border: 1px solid rgba(48, 54, 61, 0.8);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .main-score-container {
      display: flex;
      flex-direction: column;
    }
    .label-mini {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #8b949e;
    }
    .score-prime {
      font-size: 2.25rem;
      font-weight: 800;
      color: #58a6ff;
      line-height: 1.1;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      border-top: 1px solid rgba(48, 54, 61, 0.5);
      padding-top: 12px;
    }
    .stat-box {
      display: flex;
      flex-direction: column;
    }
    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      color: #c9d1d9;
    }
    
    .strike-indicator {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 4px;
    }
    .strike-circle {
      position: relative;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .strike-ring {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotate(-90deg);
    }
    .strike-x {
      position: absolute;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .active-tag {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #39d353;
      border-radius: 50%;
      margin-left: 4px;
      box-shadow: 0 0 8px #39d353;
    }

    .grid-container-wrapper {
      position: relative;
      width: 100%;
    }

    .card-array {
      display: grid;
      gap: 0;
      grid-template-columns: repeat(3, 1fr);
      width: calc(100% + 14px);
      margin-left: -7px;
      margin-right: -7px;
      aspect-ratio: 1 / 1;
      touch-action: none;
    }
    
    .grid-cell {
      width: 100%;
      height: 100%;
      padding: 7px;
      box-sizing: border-box;
      cursor: pointer;
      touch-action: none;
    }

    .card {
      width: 100%;
      height: 100%;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      position: relative;
      overflow: hidden;
    }
    .card--active {
      background: rgba(88, 166, 255, 0.1);
      border-color: #58a6ff;
      box-shadow: inset 0 0 12px rgba(88, 166, 255, 0.2);
    }
    
    @keyframes overloaded-glow {
      0% { 
        background: rgba(244, 63, 94, 0.15); 
        border-color: #f43f5e; 
        box-shadow: inset 0 0 16px rgba(244, 63, 94, 0.3), 0 0 8px rgba(244, 63, 94, 0.4); 
      }
      100% { 
        background: rgba(244, 63, 94, 0.3); 
        border-color: #ff7b72; 
        box-shadow: inset 0 0 24px rgba(244, 63, 94, 0.5), 0 0 20px rgba(244, 63, 94, 0.8); 
      }
    }
    .card--overloaded {
      animation: overloaded-glow 0.8s infinite alternate ease-in-out !important;
    }
    
    @keyframes card-shake-red {
      0%, 100% { transform: translateX(0); border-color: #30363d; }
      20%, 60% { transform: translateX(-6px); border-color: #ff7b72; box-shadow: inset 0 0 8px rgba(255,123,114,0.3); }
      40%, 80% { transform: translateX(6px); border-color: #ff7b72; box-shadow: inset 0 0 8px rgba(255,123,114,0.3); }
    }
    .card--shake {
      animation: card-shake-red 0.35s ease-in-out forwards;
    }

    .card-overlay {
      border-radius: 12px;
      border: 2px solid #58a6ff;
      box-shadow: 0 0 15px rgba(88, 166, 255, 0.4);
      pointer-events: none;
    }
    .position-root {
      position: relative;
    }
    .position-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    @keyframes floater-drift {
      0% { transform: translate(-50%, 0) scale(0.95); opacity: 0; }
      20% { transform: translate(-50%, -4px) scale(1); opacity: 0.75; }
      100% { transform: translate(-50%, -10px) scale(0.95); opacity: 0; }
    }
    .score-floater {
      position: absolute;
      left: 50%;
      top: 12px;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.95rem;
      color: #8b949e;
      pointer-events: none;
      z-index: 10;
      animation: floater-drift 0.15s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes freeze-overlay-fade {
      0%, 56.5% {
        background: rgba(13, 17, 23, 0.88);
        backdrop-filter: blur(4px);
      }
      100% {
        background: rgba(13, 17, 23, 0.35);
        backdrop-filter: blur(0px);
      }
    }
    .freeze-banner-overlay {
      position: absolute;
      top: 0;
      left: -7px;
      width: calc(100% + 14px);
      height: 100%;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      cursor: pointer;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
      animation: freeze-overlay-fade 1.15s forwards;
    }
    @keyframes freeze-title-pop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .freeze-title {
      font-size: 2.75rem;
      font-weight: 800;
      color: #ff7b72;
      letter-spacing: 0.05em;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.95), 0 0 30px rgba(255, 123, 114, 0.5);
      animation: freeze-title-pop 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.2);
    }
    @keyframes prompt-pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .freeze-sub {
      font-size: 0.85rem;
      color: #f0f6fc;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 16px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
      animation: prompt-pulse 1.5s infinite;
    }

    .menu-overlay {
      display: flex;
      flex-flow: column nowrap;
      justify-content: center;
      align-items: center;
      height: 100%;
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(8px);
      padding: 20px;
    }
    .menu-banner {
      width: 100%;
      max-width: 440px;
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 24px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
    }
    
    .lobby-banner {
      border-color: #58a6ff;
      box-shadow: 0 16px 48px rgba(88, 166, 255, 0.15);
    }
    .lobby-title {
      font-size: 2.75rem;
      font-weight: 800;
      color: #58a6ff;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .lobby-subtitle {
      font-size: 0.95rem;
      color: #8b949e;
      margin-bottom: 28px;
    }
    
    .controls-panel {
      background: rgba(22, 27, 34, 0.6);
      border: 1px solid rgba(48, 54, 61, 0.5);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 28px;
      text-align: left;
    }
    .controls-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(48, 54, 61, 0.5);
      padding-bottom: 6px;
    }
    .controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #c9d1d9;
    }
    .key-badge {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 2px 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #58a6ff;
    }

    .lost-banner {
      border-color: #ff7b72;
      box-shadow: 0 16px 48px rgba(255, 123, 114, 0.18);
    }
    .lost-banner--text {
      font-size: 2.5rem;
      font-weight: 800;
      color: #ff7b72;
      letter-spacing: -0.02em;
    }
    .lost-reason-badge {
      display: inline-block;
      background: rgba(255, 123, 114, 0.1);
      border: 1px solid rgba(255, 123, 114, 0.3);
      color: #ff7b72;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 20px;
      margin-top: 10px;
      margin-bottom: 20px;
      letter-spacing: 0.08em;
    }
    .lost-banner--score {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem;
      color: #c9d1d9;
      margin: 10px 0;
    }
    
    .celebrations-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 15px 0 24px 0;
    }
    .record-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(242, 199, 68, 0.1);
      border: 1px solid rgba(242, 199, 68, 0.3);
      color: #f2c744;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      animation: pulse 1.5s infinite;
    }
    
    .btn-action {
      background: #238636;
      color: #ffffff;
      border: 1px solid rgba(240, 246, 252, 0.1);
      border-radius: 12px;
      padding: 12px 32px;
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
    }
    .btn-action:hover {
      background: #2ea043;
    }
    .btn-action:active {
      transform: scale(0.98);
    }
    
    .restart-hint {
      margin-top: 15px;
      font-size: 0.8rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }

    @media (max-width: 400px) {
      .score-prime { font-size: 1.8rem; }
      .lobby-title { font-size: 2.2rem; }
      .lost-banner--text { font-size: 2rem; }
      .stat-val { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

<div id="app">
  <main-app></main-app>
</div>

<script>
const app = Vue.createApp({});

const MAX_DELAY = 1000;
const MISS_DELAY = 5000;
const MAX_MISSES = 3;

app.component("my-card-overlay", {
  template: `<div ref="el" class="card-overlay position-overlay"></div>`,
  props: { isFrozen: Boolean },
  setup (props) {
    const el = Vue.ref(null);
    let animationInstance = null;
    Vue.onMounted(() => {
      if (el.value && el.value.animate) {
        animationInstance = el.value.animate([
          { top: '50%', left: '50%', bottom: '50%', right: '50%', opacity: 1 },
          { top: '0', left: '0', bottom: '0', right: '0', opacity: 0.25 },
        ], { duration: MAX_DELAY, iterations: 1, fill: 'forwards' });
        if (props.isFrozen) animationInstance.pause();
      }
    });
    Vue.watch(() => props.isFrozen, (newVal) => {
      if (animationInstance) newVal ? animationInstance.pause() : animationInstance.play();
    });
    return { el };
  }
});

app.component("my-card", {
  template: `
    <div class="grid-cell" @mousedown="onMouseDown" @touchstart="onTouchStart">
      <div class="card position-root" :class="classes">
        <template v-for="target of targets" :key="target.id">
          <my-card-overlay :is-frozen="isFrozen"></my-card-overlay>
        </template>
        <div v-for="floater in floaters" :key="floater.id" class="score-floater">{{ floater.text }}</div>
      </div>
    </div>
  `,
  props: { targets: Array, floaters: Array, shaking: Boolean, isOverloaded: Boolean, isFrozen: Boolean },
  emits: ["click-action"],
  setup (props, { emit }) {
    const { targets, shaking, isOverloaded } = Vue.toRefs(props);
    const classes = Vue.computed(() => ({ 
      "card--active": targets.value.length > 0,
      "card--shake": shaking.value,
      "card--overloaded": isOverloaded.value
    }));
    return { classes, onMouseDown: e => e.button === 0 && emit("click-action", "mouse"), onTouchStart: e => { e.preventDefault(); emit("click-action", "touch"); } };
  }
});

app.component("main-app", {
  template: "#main-app",
  setup () {
    const cards = Array.from({length:9}, (_,i) => i);
    const targets = Vue.ref([]);
    const totalScore = Vue.ref(0);
    const isPlaying = Vue.ref(false);
    const isFrozenOnLoss = Vue.ref(false);
    const isProceedReady = Vue.ref(false);
    const hasLost = Vue.ref(false);
    const strikeSlots = Vue.ref([null, null, null]);
    const shakingCards = Vue.ref(new Set());
    const scoreFloaters = Vue.ref([]);
    const overloadedCardIndex = Vue.ref(null);
    const detailedLostReason = Vue.ref("");

    const highScore = Vue.ref(localStorage.getItem('highscore') || 0);
    
    const handleLose = (reason, errorCardIndex = null) => {
       isPlaying.value = false;
       detailedLostReason.value = reason === 'expired' ? "OVERLOADED" : "STRIKE-OUT";
       overloadedCardIndex.value = errorCardIndex;
       isFrozenOnLoss.value = true;
       setTimeout(() => isProceedReady.value = true, 1000);
    };

    const clicked = (i, inputMethod) => {
      if (!isPlaying.value || isFrozenOnLoss.value) return;
      
      const firstTargetIndex = targets.value.findIndex(x => x.index === i);
      
      if (firstTargetIndex >= 0) {
        targets.value.splice(firstTargetIndex, 1);
        totalScore.value += 100;
      } else {
        shakingCards.value.add(i);
        setTimeout(() => shakingCards.value.delete(i), 350);
        
        const freeSlotIdx = strikeSlots.value.findIndex(s => s === null);
        if (freeSlotIdx !== -1) {
          const timestamp = performance.now();
          strikeSlots.value[freeSlotIdx] = { timestamp };
          setTimeout(() => {
            if (isFrozenOnLoss.value || hasLost.value) return;
            strikeSlots.value[freeSlotIdx] = null;
          }, MISS_DELAY);
        }
        
        if (strikeSlots.value.filter(s => s !== null).length >= MAX_MISSES) {
          handleLose('strike', i);
        }
      }
    };

    const startGame = () => {
      targets.value = [];
      hasLost.value = false;
      isFrozenOnLoss.value = false;
      isProceedReady.value = false;
      totalScore.value = 0;
      strikeSlots.value = [null, null, null];
      isPlaying.value = true;
      overloadedCardIndex.value = null;
    };

    return { cards, totalScore, clicked, isPlaying, isFrozenOnLoss, isProceedReady, hasLost, startGame, strikeSlots, shakingCards, scoreFloaters, overloadedCardIndex, detailedLostReason, targetsById: Vue.computed(() => {
      const map = new Map(cards.map(i => [i, []]));
      targets.value.forEach(t => map.get(t.index).push(t));
      return map;
    }), proceedToSummary: () => isProceedReady.value && (isFrozenOnLoss.value = false, hasLost.value = true) };
  }
});
app.mount("#app");
</script>
</body>
</html>
