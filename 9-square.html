<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grid Reflex // 9-Square</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #0d1117;
      color: #f0f6fc;
      overscroll-behavior-y: contain;
      font-family: 'Outfit', sans-serif;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      min-height: 100vh;
    }
    .container {
      max-width: 540px;
      margin-left: auto;
      margin-right: auto;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .full-column {
      display: flex;
      flex-flow: column nowrap;
      justify-content: center;
      flex-grow: 1;
    }
    
    /* --- Modern Neon Scoreboard --- */
    .score-board {
      background: rgba(22, 27, 34, 0.8);
      border: 1px solid rgba(48, 54, 61, 0.8);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .main-score-container {
      display: flex;
      flex-direction: column;
    }
    .label-mini {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #8b949e;
    }
    .score-prime {
      font-size: 2.25rem;
      font-weight: 800;
      color: #58a6ff;
      line-height: 1.1;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      border-top: 1px solid rgba(48, 54, 61, 0.5);
      padding-top: 12px;
    }
    .stat-box {
      display: flex;
      flex-direction: column;
    }
    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      color: #c9d1d9;
    }
    .stat-val.miss {
      color: #ff7b72;
    }
    .active-tag {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #39d353;
      border-radius: 50%;
      margin-left: 4px;
      box-shadow: 0 0 8px #39d353;
    }

    /* --- Reflex Grid Space --- */
    .card-array {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(3, 1fr);
      width: 100%;
    }
    .card {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .card--active {
      background: rgba(88, 166, 255, 0.1);
      border-color: #58a6ff;
      box-shadow: inset 0 0 12px rgba(88, 166, 255, 0.2);
    }
    .card-overlay {
      border-radius: 12px;
      border: 2px solid #58a6ff;
      box-shadow: 0 0 15px rgba(88, 166, 255, 0.4);
      pointer-events: none;
    }
    .position-root {
      position: relative;
    }
    .position-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* --- Interactive Game Over Banner --- */
    .lost-container {
      display: flex;
      flex-flow: column nowrap;
      justify-content: center;
      align-items: center;
      height: 100%;
      background: rgba(13, 17, 23, 0.9);
      backdrop-filter: blur(6px);
      padding: 20px;
    }
    .lost-banner {
      width: 100%;
      max-width: 400px;
      background: #21262d;
      border: 2px solid #ff7b72;
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(255, 123, 114, 0.15);
    }
    .lost-banner--text {
      font-size: 2.5rem;
      font-weight: 800;
      color: #ff7b72;
      letter-spacing: -0.02em;
    }
    .lost-banner--score {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem;
      color: #c9d1d9;
      margin: 16px 0 24px 0;
    }
    .restart-hint {
      font-size: 0.85rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    @media (max-width: 400px) {
      .score-prime { font-size: 1.8rem; }
      .lost-banner--text { font-size: 2rem; }
      .stat-val { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

<div id="app">
  <main-app></main-app>
</div>

<!-- Scripts Area -->
<script src="https://unpkg.com/vue@3"></script>

<script>
// --- Polyfills and Prototypes ---
Array.prototype.remove = function (el) {
  const index = this.indexOf(el)
  if (index >= 0) {
    this.splice(index, 1)
  }
}
Array.prototype.count = function (predicate = () => true) {
  return this.reduce((result, item, index) => {
    if (predicate(item, index, this)) { return result + 1 }
    else { return result }
  }, 0)
}
Object.defineProperties(Array.prototype, {
  last: {
    get () { return this[this.length - 1] },
    set (newValue) {
      if (this.length <= 0) throw new Error('cannot overwrite last value of empty array')
      this[this.length - 1] = newValue
    }
  }
})

// Custom Vue ref helpers
{
  (() => {
    function addCurrentAccessor (proto) {
      const descriptor = Object.getOwnPropertyDescriptor(proto, 'value')
      Object.defineProperties(proto, {
        current: {
          configurable: true,
          enumerable: false,
          get: descriptor.get,
          set: descriptor.set,
        }
      })
    }
    addCurrentAccessor(Vue.ref().__proto__)
    addCurrentAccessor(Vue.computed(() => {}).__proto__)
    addCurrentAccessor(Vue.toRefs(Vue.reactive({ x: 0 })).x.__proto__)
  })()
}

// --- Utility Functions ---
function pipe(init, ...fs) {
  return fs.reduce((curr, f) => f(curr), init)
}
pipe.it = Symbol('pipe.it')
pipe.bound = (f, ...args) => {
  return it => {
    const realArgs = args.map(x => x === pipe.it ? it : x)
    return f(...realArgs)
  }
}
const pipeWrap = f => (...args) => x => f(x, ...args)
pipe.map = pipeWrap(map)

function *range (...args) {
  let lo = 0, hi, step = 1
  if (args.length === 1) {
    [hi] = args
  } else {
    [lo, hi, step = step] = args
  }
  let curr = lo
  while ((hi - curr) / step > 0) {
    yield curr
    curr += step
  }
}
function *map (iterable, mapper) {
  let i = 0
  for (const x of iterable) {
    yield mapper(x, i)
    i++
  }
}
function collect (iterable) {
  return Array.from(iterable)
}
function randomInt (lo, hi, step = 1) {
  return Math.floor(Math.random() * (hi - lo) / step) * step + lo
}
function useEventHandler (target, eventType, handler) {
  Vue.onMounted(() => { target.addEventListener(eventType, handler) })
  Vue.onBeforeUnmount(() => { target.removeEventListener(eventType, handler) })
}
function useComputedStorage (key, initialValue, storage = localStorage, transform = JSON) {
  let value = storage.getItem(key)
  if (value == null) {
    value = initialValue
  } else {
    value = transform.parse(value)
  }
  const _valueRef = Vue.ref(value)
  const valueRef = Vue.computed({
    get: () => _valueRef.value,
    set: (newValue) => {
      _valueRef.value = newValue
      storage.setItem(key, transform.stringify(_valueRef.value))
    },
  })
  useEventHandler(window, 'storage', (event) => {
    if (event.storageArea === storage && event.key === key) {
      valueRef.value = transform.parse(event.newValue)
    }
  })
  return valueRef
}

function not(ref) {
  return Vue.computed(() => !ref.current)
}

function usePeriodic (effect, _getPeriod, enabledRef, debug) {
  let timeoutId = null
  const getPeriod = () => {
    const value = _getPeriod()
    if (debug) console.log(value)
    return value
  }
  function update () {
    if (enabledRef.current) {
      timeoutId = setTimeout(() => {
        effect()
        update()
      }, getPeriod())
    } else {
      timeoutId = null
    }
  }
  update()
  Vue.watch(enabledRef, (isEnabled, wasEnabled) => {
    if (isEnabled && !wasEnabled && timeoutId === null) {
      update()
    }
    if (wasEnabled && !isEnabled && timeoutId !== null) {
      clearTimeout(timeoutId)
      timeoutId = null
    }
  })
  Vue.onUnmounted(() => {
    clearTimeout(timeoutId)
  })
}

class DefaultMap extends Map {
  constructor (defaultComputer, ...args) {
    super(...args)
    this.defaultComputer = defaultComputer
  }
  get (key) {
    if (!this.has(key)) {
      this.set(key, this.defaultComputer(key))
    }
    return super.get(key)
  }
}

class ListMap extends DefaultMap {
  constructor (...args) {
    super(() => [], ...args)
  }
}

const { useKeybind } = function () {
  const registrations = new ListMap()
  function handler (event) {
    registrations.get(event.code).forEach(h => { h() })   
  }
  document.addEventListener("keydown", handler)
  function useKeybind (keycode, handler) {
    function uniqueHandler () { handler() }
    registrations.get(keycode).push(uniqueHandler)
    Vue.onUnmounted(() => {
      registrations.get(keycode).remove(uniqueHandler)
    })
  }
  return { useKeybind }
}()

const { nowRef } = function () {
  const nowRef = Vue.ref(performance.now())
  function update () {
    setTimeout(() => {
      nowRef.current = performance.now()
      update()
    }, 50)
  }
  update()
  return { nowRef }
}()
</script>

<!-- Vue Component Templates -->
<script type="text/html" id="my-card-overlay">
  <div ref="el" class="card-overlay position-overlay"></div>
</script>

<script type="text/html" id="my-card">
  <div @mousedown="onMouseDown" class="card position-root" :class="classes" @touchstart="handleTouchStart">
    <template v-for="target of targets" :key="target.id">
      <my-card-overlay></my-card-overlay>
    </template>
  </div>
</script>

<script type="text/html" id="main-app">
  <div class="container">
    <div class="full-column position-root">
      
      <!-- Modern Interactive Scoreboard Panel -->
      <div class="score-board">
        <div class="score-row">
          <div class="main-score-container">
            <span class="label-mini">Current Run</span>
            <span class="score-prime">{{ totalScore }}</span>
          </div>
          <div class="main-score-container" style="text-align: right;">
            <span class="label-mini">All-Time High</span>
            <span class="score-prime" style="color: #ffd33d;">{{ highScore }}</span>
          </div>
        </div>
        
        <div class="stats-grid">
          <div class="stat-box">
            <span class="label-mini">Mouse Record <span v-if="isPureMouse" class="active-tag"></span></span>
            <span class="stat-val">{{ mouseScore }}</span>
          </div>
          <div class="stat-box">
            <span class="label-mini">Touch Record <span v-if="isPureTouch" class="active-tag"></span></span>
            <span class="stat-val" style="color: #a371f7;">{{ touchScore }}</span>
          </div>
          <div class="stat-box">
            <span class="label-mini">Input Track</span>
            <span class="stat-val">{{ currentInputType }}</span>
          </div>
          <div class="stat-box">
            <span class="label-mini">Fails</span>
            <span class="stat-val miss">{{ misses }} / 3</span>
          </div>
        </div>
      </div>

      <!-- Play Field -->
      <div class="card-array">
        <template v-for="i of cards">
          <my-card :targets="targetsById.get(i)" @click-action="clicked(i, $event)" :code="codes[i]"></my-card>
        </template>
      </div>
    </div>

    <!-- Loss Modal Overlay -->
    <div v-if="hasLost" class="position-overlay" @click="handleLostClicked">
      <div class="lost-container">
        <div class="lost-banner">
          <div class="lost-banner--text">Run Ended</div>
          <div class="lost-banner--score">Score: {{ totalScore }}</div>
          <div class="restart-hint">Tap screen or Space to reset</div>
        </div>
      </div>
    </div>
  </div>
</script>

<!-- Vue Component Logic Definitions -->
<script>
app.component("my-card-overlay", {
  template: "#my-card-overlay",
  setup () {
    const el = Vue.ref(null)
    Vue.onMounted(() => {
      if (el.current && el.current.animate) {
        el.current.animate([
          { top: '50%', left: '50%', bottom: '50%', right: '50%', opacity: 1 },
          { top: '0', left: '0', bottom: '0', right: '0', opacity: 0.25 },
        ], {
          duration: MAX_DELAY,
          iterations: 1, 
        })
      }
    })
    return { el }
  }
})

app.component("my-card", {
  template: "#my-card",
  props: {
    targets: Array,
  },
  emits: ["click-action"],
  setup (props, { emit }) {
    const { targets } = Vue.toRefs(props)
    const isActiveTarget = Vue.computed(() => {
      return targets.current.some(x => true)
    })
    const classes = Vue.computed(() => {
      return { "card--active": isActiveTarget.current }
    })
    const onMouseDown = (event) => {
      // Discard clicks that are simulated from mobile touch taps
      if (event.detail === 0) return; 
      emit("click-action", "mouse")
    }
    const handleTouchStart = (event) => {
      emit("click-action", "touch")
      if (event.cancelable) event.preventDefault()
    }
    return { classes, onMouseDown, handleTouchStart }
  }
})

app.component("main-app", {
  template: "#main-app",
  setup () {
    const getId = (() => {
      let currId = 0
      return () => currId++
    })()
    const cards = pipe(9, range, collect)
    const targets = Vue.ref([])
    const totalScore = Vue.ref(0)
    const hasLost = Vue.ref(false)
    let lostTime = null

    const misses = Vue.ref(0)
    const missTimeoutIds = []
    
    // Independent Pure State Systems
    const isPureMouse = Vue.ref(true)
    const isPureTouch = Vue.ref(true)

    const highScore = useComputedStorage('v2-ominous-all', 0)
    const mouseScore = useComputedStorage('v2-outrageous-mouse', 0)
    const touchScore = useComputedStorage('v2-outstanding-touch', 0)

    const currentInputType = Vue.computed(() => {
      if (!isPureMouse.current && !isPureTouch.current) return "Keyboard / Hybrid"
      if (isPureTouch.current && !isPureMouse.current) return "Touch Only"
      if (isPureMouse.current && !isPureTouch.current) return "Mouse Only"
      return "Ready"
    })

    const targetsById = Vue.computed(() => {
      const map = new Map()
      cards.forEach(i => { map.set(i, []) })
      for (const t of targets.current) {
        map.get(t.index).push(t)
      }
      return map
    })

    const handleLose = () => {
       hasLost.current = true
       lostTime = performance.now()
       if (totalScore.current > highScore.current) highScore.current = totalScore.current
       if (isPureMouse.current && totalScore.current > mouseScore.current) mouseScore.current = totalScore.current
       if (isPureTouch.current && totalScore.current > touchScore.current) touchScore.current = totalScore.current
    }

    const clicked = (i, inputMethod) => {
      if (hasLost.current) return;
      
      // Update dynamic scoring validations statewise
      if (inputMethod === "mouse") {
        isPureTouch.current = false
      } else if (inputMethod === "touch") {
        isPureMouse.current = false
      } else if (inputMethod === "keyboard") {
        isPureMouse.current = false
        isPureTouch.current = false
      }

      const now = performance.now()
      const firstTargetIndex = targets.current.findIndex(x => x.index === i)
      if (firstTargetIndex >= 0) {
        const firstTarget = targets.current[firstTargetIndex]
        const score = firstTarget.when + MAX_DELAY - performance.now()
        if (score > 0) {
          totalScore.current += Math.floor(score)
        }
        targets.current.splice(firstTargetIndex, 1)
      } else {
        misses.current++
        missTimeoutIds.push(setTimeout(() => {
          misses.current--
        }, MISS_DELAY))
        if (misses.current >= MAX_MISSES) {
          handleLose()
        }
      }
    }

    const gameStartTime = Vue.ref(performance.now())
    const period = () => Math.floor(1000 * Math.pow(Math.E, -(performance.now() - gameStartTime.current) * Math.log(0.33333) / -60000))
    
    usePeriodic(function () {
      if (!hasLost.current) { targets.current.push({ id: getId(), index: randomInt(0, 9), when: performance.now() }) }
    }, period, not(hasLost))

    Vue.watchEffect(() => {
      if (!hasLost.current) {
        const now = nowRef.current
        const lost = targets.current.some(x => x.when + MAX_DELAY - now < 0)
        if (lost) {
          handleLose()
        }
      }
    })

    const reset = () => {
      gameStartTime.current = performance.now()
      targets.current = []
      hasLost.current = false
      totalScore.current = 0
      missTimeoutIds.forEach(id => clearTimeout(id))
      misses.current = 0
      isPureMouse.current = true
      isPureTouch.current = true
    }

    const codes = pipe([7, 8, 9, 4, 5, 6, 1, 2, 3], pipe.map(x => `Numpad${x}`), collect)

    for (const [keybind, i] of enumerate(codes)) {
      useKeybind(keybind, () => {
        clicked(i, "keyboard")
      })
    }

    useKeybind("Space", () => {
      if (hasLost.current) reset()
    })

    Vue.onMounted(() => { reset() })

    const LOST_INTERACTIVE_DELAY = 1000
    const handleLostClicked = () => {
        if (performance.now() - lostTime > LOST_INTERACTIVE_DELAY) {
           reset()
        }
    }

    return {
      cards,
      targetsById,
      totalScore,
      clicked,
      hasLost,
      reset,
      highScore,
      codes,
      misses,
      mouseScore,
      touchScore,
      isPureMouse,
      isPureTouch,
      currentInputType,
      handleLostClicked,
    }
  }
})

// Mount App
window.root = app.mount("#app")
</script>
</body>
</html>
